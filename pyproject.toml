[project]
name = "zerong"
version = "0.1.0"
description = "Visual inspection for factories that have no defect (NG) images yet."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # anomalib's API changes between minor versions: keep this pinned.
    "anomalib[openvino]==2.6.1",
    "torch>=2.6",
    "torchvision>=0.21",
    "onnxruntime>=1.18",
    "mlflow>=3.15",
    "numpy>=1.26",
    "pyyaml>=6",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zerong"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
